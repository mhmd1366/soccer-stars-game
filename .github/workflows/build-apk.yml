name: Build Android APK & Publish Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & prepare web assets
        run: |
          npm install
          npm run prepare-www

      - name: Add and sync Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Enable Android Immersive Fullscreen in MainActivity
        run: |
          python3 - << 'EOF'
          import glob
          files = glob.glob("android/app/src/main/java/**/MainActivity.java", recursive=True)
          for path in files:
              code = open(path, encoding="utf-8").read()
              pkg = [line for line in code.splitlines() if line.startswith("package ")][0]
              new_code = pkg + """

          import android.os.Bundle;
          import android.view.View;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  enableImmersiveMode();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) enableImmersiveMode();
              }

              private void enableImmersiveMode() {
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  View decorView = getWindow().getDecorView();
                  WindowInsetsControllerCompat controller = WindowCompat.getInsetsController(getWindow(), decorView);
                  if (controller != null) {
                      controller.hide(WindowInsetsCompat.Type.systemBars());
                      controller.setSystemBarsBehavior(
                          WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                      );
                  }
              }
          }
          """
              open(path, "w", encoding="utf-8").write(new_code)
              print("Patched fullscreen MainActivity:", path)
          EOF

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk soccer-stars-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: soccer-stars-apk
          path: soccer-stars-v1.0.0.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: فوتبال انگشتی (نسخه اندروید APK)
          body: |
            نسخه اندروید بازی **فوتبال انگشتی (Soccer Stars)** به‌صورت خودکار با GitHub Actions ساخته شد.
            برای نصب روی گوشی اندروید، فایل `soccer-stars-v1.0.0.apk` را از بخش Assets زیر دانلود کنید.
          files: soccer-stars-v1.0.0.apk
