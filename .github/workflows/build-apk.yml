name: Build Android APK & Publish Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & prepare web assets
        run: |
          npm install
          npm run prepare-www

      - name: Add and sync Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk soccer-stars-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: soccer-stars-apk
          path: soccer-stars-v1.0.0.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: فوتبال انگشتی (نسخه اندروید APK)
          body: |
            نسخه اندروید بازی **فوتبال انگشتی (Soccer Stars)** به‌صورت خودکار با GitHub Actions ساخته شد.
            برای نصب روی گوشی اندروید، فایل `soccer-stars-v1.0.0.apk` را از بخش Assets زیر دانلود کنید.
          files: soccer-stars-v1.0.0.apk
